name: Deploy to All-Inkl via FTPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dist (only web files)
        run: |
          rm -rf dist
          mkdir -p dist
          shopt -s dotglob
          cp -r admin includes public data index.html index.php config.php CNAME .htaccess dist/ 2>/dev/null || true
          # optional: if you have root assets folder
          cp -r assets dist/ 2>/dev/null || true

      - name: Deploy via FTPS (dist only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: ftps
          port: ${{ secrets.SFTP_PORT }}
          server-dir: ${{ secrets.SFTP_REMOTE_PATH }}
          local-dir: dist/
          log-level: minimal
          # SQLite niemals deployen
          exclude: |
            data/*.sqlite
            data/*.db
