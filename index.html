<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Scoreboard Ballsporthalle</title>
    <link rel="stylesheet" href="/public/assets/style.css">
</head>
<body>
    <header class="topbar">
        <h1>Scoreboard Ballsporthalle</h1>
        <div class="topbar-logo">
            <img src="/public/logo/Logo_UBC_230px.png" alt="UBC Logo">
        </div>
        <nav>
            <a href="/admin/login.php">Admin</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Neues Spiel anlegen</h2>
            <form id="create-game-form" action="/public/create.php" method="get">
                <div class="grid">
                    <label>
                        Spieltitel
                        <input type="text" name="title" required maxlength="60" value="Spiel UBC vs Gast">
                    </label>
                    <label>
                        Heimteam
                        <input type="text" name="team_home" required maxlength="40" value="UBC">
                    </label>
                    <label>
                        Auswärtsteam
                        <input type="text" name="team_away" required maxlength="40" value="Gast">
                    </label>
                </div>
                <button type="submit">Weiter zur Detailseite</button>
            </form>
            <p class="muted" style="margin-top: 0.75rem;">Auf der Detailseite können Namen der Spieler*innen angepasst werden. Dort wird auch nach dem Speichern ein Passwort für die Steuerung erstellt.</p>
        </section>

        <section class="card">
            <h2>Aktive Spiele</h2>
            <div id="game-list" class="game-list"></div>
        </section>
    </main>

    <script>
        const listEl = document.getElementById('game-list');
        const renderGames = (games = []) => {
            if (!games.length) {
                listEl.innerHTML = '<p>Keine aktiven Spiele.</p>';
                return;
            }
            listEl.innerHTML = games.map((game) => `
                <div class="card">
                    <h3>${game.title}</h3>
                    <p>${game.team_home} vs ${game.team_away}</p>
                    <p>${game.home_score} : ${game.away_score}</p>
                    <div class="actions">
                        <a class="button secondary" href="/public/view.php?id=${game.id}" target="_blank">Anzeigen</a>
                        <form method="post" action="/public/control.php?id=${game.id}" class="inline">
                            <input type="password" name="password" placeholder="Steuer-Passwort" required>
                            <button type="submit">Steuern</button>
                        </form>
                    </div>
                </div>
            `).join('');
        };

        const loadGames = async () => {
            try {
                const response = await fetch('/public/api.php?action=list');
                if (!response.ok) {
                    return;
                }
                const payload = await response.json();
                renderGames(payload.games || []);
            } catch (error) {
                console.warn('Konnte Spiele nicht laden', error);
            }
        };

        loadGames();
    </script>
</body>
</html>
