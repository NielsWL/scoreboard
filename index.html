                        </div>
                        <div class="player-row">

                        <div class="player-row">

                        <div class="player-row">
                            <input type="text" name="home_player_number[]" placeholder="#" maxlength="10">
                            <input type="text" name="home_player_name[]" required maxlength="40" value="UBC Name5">
                        </div>
                        <div class="player-row">
                            <input type="text" name="home_player_number[]" placeholder="#" maxlength="10">
                            <input type="text" name="home_player_name[]" required maxlength="40" value="UBC Name6">
                        </div>
                        <div class="player-row">
                            <input type="text" name="home_player_number[]" placeholder="#" maxlength="10">
                            <input type="text" name="home_player_name[]" required maxlength="40" value="UBC Name7">
                        </div>
                        <div class="player-row">
                            <input type="text" name="home_player_number[]" placeholder="#" maxlength="10">
                            <input type="text" name="home_player_name[]" required maxlength="40" value="UBC Name8">
                        </div>
                        <div class="player-row">
                            <input type="text" name="home_player_number[]" placeholder="#" maxlength="10">
                            <input type="text" name="home_player_name[]" required maxlength="40" value="UBC Name9">

                        <div class="player-row">
                            <input type="text" name="home_player_number[]" placeholder="#" maxlength="10">

            <div id="create-result" class="muted" style="margin-top: 1rem;"></div>
        </section>

        <section class="card">
            <h2>Aktive Spiele</h2>
            <div id="game-list" class="game-list"></div>
        </section>
    </main>

    <script>
        const listEl = document.getElementById('game-list');
        const formEl = document.getElementById('create-game-form');
        const resultEl = document.getElementById('create-result');

        const renderGames = (games = []) => {
            if (!games.length) {
                listEl.innerHTML = '<p>Keine aktiven Spiele.</p>';
                return;
            }
            listEl.innerHTML = games.map((game) => `
                <div class="card">
                    <h3>${game.title}</h3>
                    <p>${game.team_home} vs ${game.team_away}</p>
                    <p>${game.home_score} : ${game.away_score}</p>
                    <div class="actions">
                        <a class="button secondary" href="/public/view.php?id=${game.id}" target="_blank">Anzeigen</a>
                        <form method="post" action="/public/control.php?id=${game.id}" class="inline">
                            <input type="password" name="password" placeholder="Steuer-Passwort" required>
                            <button type="submit">Steuern</button>
                        </form>
                    </div>
                </div>
            `).join('');
        };

        const loadGames = async () => {
            try {
                const response = await fetch('/public/api.php?action=list');
                if (!response.ok) {
                    return;
                }
                const payload = await response.json();
                renderGames(payload.games || []);
            } catch (error) {
                console.warn('Konnte Spiele nicht laden', error);
            }
        };

        formEl.addEventListener('submit', async (event) => {
            event.preventDefault();
            resultEl.textContent = 'Spiel wird angelegt...';
            try {
                const response = await fetch('/public/api.php?action=create', {
                    method: 'POST',
                    body: new FormData(formEl),
                });
                const payload = await response.json();
                if (!response.ok) {
                    resultEl.textContent = payload.error || 'Fehler beim Anlegen.';
                    return;
                }
                resultEl.innerHTML = `Steuer-Passwort: <strong>${payload.password}</strong> (Spiel #${payload.game_id})`;
                await loadGames();
            } catch (error) {
                resultEl.textContent = 'Fehler beim Anlegen.';
            }
        });

        loadGames();
    </script>
</body>
</html>
